<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rekod English Remedial (TP1 & TP2)</title>
    <!-- Google Fonts & FontAwesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; color: #fff; }
        .card { width: 100%; max-width: 500px; background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; padding: 30px; box-shadow: 0 15px 35px rgba(0,0,0,0.5); }
        h2 { text-align: center; margin-bottom: 5px; color: #f97316; font-size: 1.5rem; }
        p.desc { text-align: center; color: #94a3b8; font-size: 0.85rem; margin-bottom: 25px; }
        .form-group { margin-bottom: 18px; text-align: left; }
        label { display: block; font-size: 0.85rem; margin-bottom: 6px; color: #cbd5e1; font-weight: 600; }
        input, select, textarea { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.2); background: rgba(0, 0, 0, 0.2); color: #fff; font-size: 0.9rem; outline: none; }
        input:focus, select:focus, textarea:focus { border-color: #f97316; }
        option { background: #1e293b; color: #fff; }
        .btn-submit { width: 100%; padding: 14px; border: none; border-radius: 10px; background: linear-gradient(135deg, #f97316 0%, #ea580c 100%); color: #fff; font-weight: 600; font-size: 1rem; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .btn-submit:hover { opacity: 0.9; transform: translateY(-2px); }
        .back-link { display: block; text-align: center; margin-top: 15px; color: #94a3b8; text-decoration: none; font-size: 0.85rem; }
        .back-link:hover { color: #fff; }
        #statusMsg { text-align: center; margin-top: 15px; font-size: 0.9rem; font-weight: 600; }
    </style>
</head>
<body>

    <div class="card">
        <h2><i class="fa-solid fa-child-reaching"></i> English Remedial</h2>
        <p class="desc">Borang Input Rekod Murid TP1 & TP2</p>

        <form id="remedialForm">
            <div class="form-group">
                <label>Nama Murid</label>
                <input type="text" id="nama" placeholder="Contoh: Muhammad Ali" required>
            </div>

            <div class="form-group">
                <label>Kelas</label>
                <input type="text" id="kelas" placeholder="Contoh: 3 Cemerlang" required>
            </div>

            <div class="form-group">
                <label>Tahap Penguasaan (TP)</label>
                <select id="tp" required>
                    <option value="">-- Pilih TP --</option>
                    <option value="TP1">TP 1</option>
                    <option value="TP2">TP 2</option>
                </select>
            </div>

            <div class="form-group">
                <label>Kemahiran / Catatan Perkembangan</label>
                <textarea id="catatan" rows="3" placeholder="Contoh: Perlu bimbingan mengeja perkataan asas..."></textarea>
            </div>

            <button type="submit" class="btn-submit" id="btnSubmit">Hantar Rekod</button>
        </form>

        <div id="statusMsg"></div>

        <a href="index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Kembali ke Portal Utama</a>
    </div>

    <script>
        // Pautan Apps Script cikgu
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzh5OHu2OnB10rC5-8VsLWZ0TPI-Pr1SGGYRUC6_SKgwIQjxWuxMviG6n5qRy3dgreV/exec';

        document.getElementById('remedialForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const btn = document.getElementById('btnSubmit');
            const statusMsg = document.getElementById('statusMsg');
            
            btn.disabled = true;
            btn.innerText = 'Sedang Dihantar...';
            statusMsg.innerText = '';

            const payload = {
                nama: document.getElementById('nama').value,
                kelas: document.getElementById('kelas').value,
                tp: document.getElementById('tp').value,
                catatan: document.getElementById('catatan').value
            };

            fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(() => {
                statusMsg.style.color = '#10b981';
                statusMsg.innerText = '✅ Rekod berjaya disimpan ke Google Sheet!';
                document.getElementById('remedialForm').reset();
                btn.disabled = false;
                btn.innerText = 'Hantar Rekod';
            })
            .catch(error => {
                statusMsg.style.color = '#ef4444';
                statusMsg.innerText = '❌ Ralat penghantaran. Sila cuba lagi.';
                btn.disabled = false;
                btn.innerText = 'Hantar Rekod';
            });
        });
    </script>
</body>
</html>
