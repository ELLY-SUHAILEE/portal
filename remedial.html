<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Remedial Practice (TP1 & TP2)</title>
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Fredoka', 'Poppins', sans-serif; }
        body { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); min-height: 100vh; padding: 20px; color: #fff; font-size: 1.1rem; }
        .container { max-width: 800px; margin: 0 auto; background: rgba(255, 255, 255, 0.07); backdrop-filter: blur(12px); border: 2px solid rgba(255, 255, 255, 0.15); border-radius: 24px; padding: 30px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
        
        .header-title { text-align: center; color: #fbbf24; font-size: 2.2rem; margin-bottom: 5px; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
        .header-subtitle { text-align: center; color: #cbd5e1; font-size: 1.1rem; margin-bottom: 25px; }
        
        .student-info { background: rgba(0, 0, 0, 0.3); border-radius: 16px; padding: 20px; margin-bottom: 30px; border: 1px solid rgba(255, 255, 255, 0.1); }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 1.1rem; margin-bottom: 8px; color: #38bdf8; font-weight: 600; }
        input[type="text"], select { width: 100%; padding: 14px; border-radius: 12px; border: 2px solid #38bdf8; background: #0f172a; color: #fff; font-size: 1.1rem; outline: none; }
        select option { background: #0f172a; color: #fff; }

        .section-header { background: linear-gradient(135deg, #f97316 0%, #ea580c 100%); padding: 15px 20px; border-radius: 16px; margin: 35px 0 20px 0; font-size: 1.3rem; font-weight: 700; display: flex; align-items: center; gap: 12px; box-shadow: 0 4px 15px rgba(249, 115, 22, 0.4); }
        
        .question-card { background: rgba(255, 255, 255, 0.05); border: 2px solid rgba(255, 255, 255, 0.1); border-radius: 20px; padding: 20px; margin-bottom: 25px; text-align: center; }
        .question-num { font-size: 1.2rem; color: #fbbf24; font-weight: 700; margin-bottom: 10px; text-align: left; }
        .question-text { font-size: 1.3rem; color: #ffffff; margin-bottom: 15px; line-height: 1.4; font-weight: 600; }
        
        .q-img { width: 100%; max-width: 320px; height: 200px; object-fit: cover; border-radius: 16px; margin: 10px auto 20px auto; display: block; border: 4px solid #38bdf8; box-shadow: 0 8px 20px rgba(0,0,0,0.4); background: #fff; }
        
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 15px; }
        @media (max-width: 600px) { .options-grid { grid-template-columns: 1fr; } }
        
        .option-btn { background: rgba(255, 255, 255, 0.1); border: 2px solid rgba(255, 255, 255, 0.2); border-radius: 12px; padding: 14px; font-size: 1.1rem; color: #fff; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 600; }
        .option-btn:hover { background: rgba(56, 189, 248, 0.2); border-color: #38bdf8; }
        
        input[type="radio"] { display: none; }
        input[type="radio"]:checked + .option-btn { background: #38bdf8; color: #0f172a; border-color: #38bdf8; font-weight: 700; transform: scale(1.02); }
        
        .btn-submit { width: 100%; padding: 18px; border: none; border-radius: 16px; background: linear-gradient(135deg, #10b981 0%, #059669 100%); color: #fff; font-size: 1.4rem; font-weight: 700; cursor: pointer; margin-top: 30px; box-shadow: 0 10px 25px rgba(16, 185, 129, 0.4); transition: 0.3s; }
        .btn-submit:hover { transform: translateY(-3px); filter: brightness(1.1); }
        
        .back-link { display: block; text-align: center; margin-top: 25px; color: #94a3b8; text-decoration: none; font-size: 1.1rem; }
        .back-link:hover { color: #fff; }
        #statusMsg { text-align: center; margin-top: 20px; font-size: 1.3rem; font-weight: 700; }
    </style>
</head>
<body>

    <div class="container">
        <h1 class="header-title"><i class="fa-solid fa-star"></i> REMEDIAL ENGLISH PRACTICE</h1>
        <p class="header-subtitle">Superminds Year 1 & 2 | Get Smart Year 3</p>

        <form id="quizForm">
            <div class="student-info">
                <div class="form-group">
                    <label><i class="fa-solid fa-user"></i> Student Name:</label>
                    <input type="text" id="nama" placeholder="Type your name..." required>
                </div>
                <div class="form-group">
                    <label><i class="fa-solid fa-school"></i> Class:</label>
                    <input type="text" id="kelas" placeholder="Example: 1 Cemerlang" required>
                </div>
                <div class="form-group">
                    <label><i class="fa-solid fa-book-bookmark"></i> Select Module:</label>
                    <select id="moduleSelect" onchange="loadQuestions()">
                        <option value="m1">Module 1 (Year 1): Friends & At School</option>
                        <option value="m2">Module 2 (Year 1): Pet Show & Lunchtime</option>
                        <option value="m3">Module 3 (Year 2): Free Time & Body Parts</option>
                        <option value="m4">Module 4 (Year 2): At the Beach & Animals</option>
                        <option value="m5">Module 5 (Year 3): Welcome! & Every Day</option>
                        <option value="m6">Module 6 (Year 3): Right Now & On the Farm</option>
                    </select>
                </div>
            </div>

            <!-- SKILL SECTIONS -->
            <div class="section-header"><i class="fa-solid fa-book-open"></i> SKILL 1: READING</div>
            <div id="readingContainer"></div>

            <div class="section-header"><i class="fa-solid fa-pen-to-square"></i> SKILL 2: WRITING</div>
            <div id="writingContainer"></div>

            <div class="section-header"><i class="fa-solid fa-spell-check"></i> SKILL 3: GRAMMAR</div>
            <div id="grammarContainer"></div>

            <div class="section-header"><i class="fa-solid fa-font"></i> SKILL 4: SPELLING</div>
            <div id="spellingContainer"></div>

            <button type="submit" class="btn-submit" id="btnSubmit"><i class="fa-solid fa-paper-plane"></i> SUBMIT ANSWERS</button>
        </form>

        <div id="statusMsg"></div>

        <a href="index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to Main Portal</a>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzh5OHu2OnB10rC5-8VsLWZ0TPI-Pr1SGGYRUC6_SKgwIQjxWuxMviG6n5qRy3dgreV/exec';

        // DATABASE SOALAN DENGAN GAMBAR YANG PADAN DAN TEPAT 100%
        const modulesData = {
            m1: {
                reading: [
                    { id: "m1_r1", q: "Look at the picture. What is this?", img: "https://images.unsplash.com/photo-1585336261026-8f5786372966?w=400&q=80", options: ["It is a pencil.", "It is a ruler.", "It is a desk."], ans: "It is a pencil." },
                    { id: "m1_r2", q: "What is this item?", img: "https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=400&q=80", options: ["This is a bag.", "This is a pen.", "This is an eraser."], ans: "This is a bag." }
                ],
                writing: [
                    { id: "m1_w1", q: "Fill in the blank: Open your ______.", img: "https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?w=400&q=80", options: ["book", "bag", "pencil"], ans: "book" },
                    { id: "m1_w2", q: "Complete sentence: This is a ______.", img: "https://images.unsplash.com/photo-1561070791-2526d30994b5?w=400&q=80", options: ["chair", "ruler", "pen"], ans: "chair" }
                ],
                grammar: [
                    { id: "m1_g1", q: "Choose 'a' or 'an': This is ______ apple.", img: "https://images.unsplash.com/photo-1560806887-1e4cd0b6cbd6?w=400&q=80", options: ["a", "an"], ans: "an" },
                    { id: "m1_g2", q: "Choose 'a' or 'an': It is ______ ruler.", img: "https://images.unsplash.com/photo-1588072432836-e10032774350?w=400&q=80", options: ["a", "an"], ans: "a" }
                ],
                spelling: [
                    { id: "m1_s1", q: "Select the correct spelling:", img: "https://images.unsplash.com/photo-1585336261026-8f5786372966?w=400&q=80", options: ["Pencil", "Pensil", "Pencel"], ans: "Pencil" },
                    { id: "m1_s2", q: "Select the correct spelling:", img: "https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=400&q=80", options: ["Bag", "Bagg", "Beg"], ans: "Bag" }
                ]
            },
            m2: {
                reading: [
                    { id: "m2_r1", q: "Look at the picture. What animal is this?", img: "https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?w=400&q=80", options: ["It is a cat.", "It is a dog.", "It is a frog."], ans: "It is a cat." },
                    { id: "m2_r2", q: "What food is this?", img: "https://images.unsplash.com/photo-1513104890138-7c749659a591?w=400&q=80", options: ["Pizza", "Apple", "Banana"], ans: "Pizza" }
                ],
                writing: [
                    { id: "m2_w1", q: "Complete sentence: I like to eat ______.", img: "https://images.unsplash.com/photo-1571771894821-ce9b6c11b08e?w=400&q=80", options: ["bananas", "carrots", "pizza"], ans: "bananas" }
                ],
                grammar: [
                    { id: "m2_g1", q: "Where is the cat? The cat is ______ the box.", img: "https://images.unsplash.com/photo-1543852786-1cf6624b9987?w=400&q=80", options: ["in", "under", "on"], ans: "in" }
                ],
                spelling: [
                    { id: "m2_s1", q: "Choose the correct spelling:", img: "https://images.unsplash.com/photo-1535268647677-300dbf3d78d1?w=400&q=80", options: ["Duck", "Dak", "Duk"], ans: "Duck" }
                ]
            },
            m3: {
                reading: [
                    { id: "m3_r1", q: "What toy is this?", img: "https://images.unsplash.com/photo-1596461404969-9ae70f2830c1?w=400&q=80", options: ["A toy car", "A kite", "A monster"], ans: "A toy car" }
                ],
                writing: [
                    { id: "m3_w1", q: "Look at the picture. Wash your ______.", img: "https://images.unsplash.com/photo-1584308666744-24d5c474f2ae?w=400&q=80", options: ["hands", "feet", "hair"], ans: "hands" }
                ],
                grammar: [
                    { id: "m3_g1", q: "Select the correct sentence:", img: "https://images.unsplash.com/photo-1508098682722-e99c43a406b2?w=400&q=80", options: ["I play football.", "I play footballs.", "I plays football."], ans: "I play football." }
                ],
                spelling: [
                    { id: "m3_s1", q: "Choose correct spelling:", img: "https://images.unsplash.com/photo-1558060370-d644479cb6f7?w=400&q=80", options: ["Teddy bear", "Tedi bear", "Teddy bar"], ans: "Teddy bear" }
                ]
            },
            m4: {
                reading: [
                    { id: "m4_r1", q: "Where are they?", img: "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=400&q=80", options: ["At the beach", "At school", "At home"], ans: "At the beach" }
                ],
                writing: [
                    { id: "m4_w1", q: "Let's build a ______.", img: "https://images.unsplash.com/photo-1509316975850-ff9c5deb0cd9?w=400&q=80", options: ["sandcastle", "house", "boat"], ans: "sandcastle" }
                ],
                grammar: [
                    { id: "m4_g1", q: "A fish ______ swim.", img: "https://images.unsplash.com/photo-1522069169874-c58ec4b76be5?w=400&q=80", options: ["can", "can't"], ans: "can" }
                ],
                spelling: [
                    { id: "m4_s1", q: "Choose correct spelling:", img: "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=400&q=80", options: ["Beach", "Beech", "Beachh"], ans: "Beach" }
                ]
            },
            m5: {
                reading: [
                    { id: "m5_r1", q: "What time is shown?", img: "https://images.unsplash.com/photo-1563861826100-9cb868fdbe1c?w=400&q=80", options: ["Clock", "Watch", "Timer"], ans: "Clock" }
                ],
                writing: [
                    { id: "m5_w1", q: "He is wearing ______.", img: "https://images.unsplash.com/photo-1524805444758-089113d48a6d?w=400&q=80", options: ["a watch", "a hat", "shoes"], ans: "a watch" }
                ],
                grammar: [
                    { id: "m5_g1", q: "She ______ brown hair.", img: "https://images.unsplash.com/photo-1517841905240-472988babdf9?w=400&q=80", options: ["has got", "have got"], ans: "has got" }
                ],
                spelling: [
                    { id: "m5_s1", q: "Choose correct spelling:", img: "https://images.unsplash.com/photo-1563861826100-9cb868fdbe1c?w=400&q=80", options: ["Clock", "Klock", "Clok"], ans: "Clock" }
                ]
            },
            m6: {
                reading: [
                    { id: "m6_r1", q: "What animal is running?", img: "https://images.unsplash.com/photo-1553284965-83fd3e82fa5a?w=400&q=80", options: ["A horse", "A cow", "A sheep"], ans: "A horse" }
                ],
                writing: [
                    { id: "m6_w1", q: "The cow gives us ______.", img: "https://images.unsplash.com/photo-1550583724-b2692b85b150?w=400&q=80", options: ["milk", "juice", "water"], ans: "milk" }
                ],
                grammar: [
                    { id: "m6_g1", q: "The horse ______ running.", img: "https://images.unsplash.com/photo-1553284965-83fd3e82fa5a?w=400&q=80", options: ["is", "are", "am"], ans: "is" }
                ],
                spelling: [
                    { id: "m6_s1", q: "Choose correct spelling:", img: "https://images.unsplash.com/photo-1553284965-83fd3e82fa5a?w=400&q=80", options: ["Horse", "Horss", "Horce"], ans: "Horse" }
                ]
            }
        };

        function loadQuestions() {
            const modKey = document.getElementById('moduleSelect').value;
            const currentMod = modulesData[modKey];

            renderCategory(currentMod.reading || [], 'readingContainer');
            renderCategory(currentMod.writing || [], 'writingContainer');
            renderCategory(currentMod.grammar || [], 'grammarContainer');
            renderCategory(currentMod.spelling || [], 'spellingContainer');
        }

        function renderCategory(items, containerId) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';

            if(items.length === 0) {
                container.innerHTML = '<p style="text-align:center; color:#cbd5e1;">No questions in this category.</p>';
                return;
            }

            items.forEach((q, idx) => {
                let optionsHTML = '';
                q.options.forEach(opt => {
                    optionsHTML += `
                        <label>
                            <input type="radio" name="${q.id}" value="${opt}" required>
                            <div class="option-btn">${opt}</div>
                        </label>
                    `;
                });

                container.innerHTML += `
                    <div class="question-card">
                        <div class="question-num">Question ${idx + 1}</div>
                        <div class="question-text">${q.q}</div>
                        <img src="${q.img}" class="q-img" alt="Question Image">
                        <div class="options-grid">${optionsHTML}</div>
                    </div>
                `;
            });
        }

        loadQuestions();

        document.getElementById('quizForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const btn = document.getElementById('btnSubmit');
            const statusMsg = document.getElementById('statusMsg');
            const modKey = document.getElementById('moduleSelect').value;
            const currentMod = modulesData[modKey];

            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Submitting Answers...';

            let score = 0;
            let totalQ = 0;

            ['reading', 'writing', 'grammar', 'spelling'].forEach(cat => {
                (currentMod[cat] || []).forEach(q => {
                    totalQ++;
                    const selected = document.querySelector(`input[name="${q.id}"]:checked`);
                    if (selected && selected.value === q.ans) score++;
                });
            });

            const payload = {
                nama: document.getElementById('nama').value,
                kelas: document.getElementById('kelas').value,
                tp: score >= Math.ceil(totalQ / 2) ? "TP2" : "TP1",
                catatan: `Remedial Module | Score: ${score}/${totalQ}`
            };

            fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(() => {
                statusMsg.style.color = '#10b981';
                statusMsg.innerHTML = `🎉 Well done! Your answers are submitted.<br><strong>Your Score: ${score} / ${totalQ}</strong>`;
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-check"></i> COMPLETED';
            })
            .catch(() => {
                statusMsg.style.color = '#ef4444';
                statusMsg.innerText = '❌ Error submitting. Please try again.';
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> SUBMIT ANSWERS';
            });
        });
    </script>
</body>
</html>
