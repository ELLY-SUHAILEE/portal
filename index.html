<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Bahasa Inggeris - Utama</title>
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Fredoka', 'Poppins', sans-serif; }
        body { 
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); 
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            padding: 20px; 
            color: #fff; 
        }
        .portal-card { 
            background: rgba(255, 255, 255, 0.08); 
            backdrop-filter: blur(16px); 
            border: 2px solid rgba(255, 255, 255, 0.15); 
            border-radius: 28px; 
            padding: 40px 30px; 
            max-width: 500px; 
            width: 100%; 
            text-align: center; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.5); 
        }
        .main-title { 
            font-size: 2.2rem; 
            color: #fbbf24; 
            margin-bottom: 10px; 
            text-shadow: 2px 2px 4px rgba(0,0,0,0.4); 
        }
        .sub-title { 
            font-size: 1.1rem; 
            color: #cbd5e1; 
            margin-bottom: 35px; 
        }
        .btn-group { 
            display: flex; 
            flex-direction: column; 
            gap: 18px; 
        }
        .btn { 
            padding: 18px 24px; 
            border-radius: 18px; 
            font-size: 1.2rem; 
            font-weight: 700; 
            text-decoration: none; 
            color: #fff; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 12px; 
            transition: all 0.3s ease; 
            border: none;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }
        .btn:hover { 
            transform: translateY(-3px) scale(1.02); 
            filter: brightness(1.1); 
        }
        
        /* Butang Modul Utama */
        .btn-getsmart { 
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%); 
        }
        .btn-remedial { 
            background: linear-gradient(135deg, #f97316 0%, #ea580c 100%); 
        }
        
        /* Butang Rekod Guru (Akses Khas) */
        .btn-teacher { 
            background: linear-gradient(135deg, #10b981 0%, #047857 100%); 
            margin-top: 10px;
            border: 2px dashed #6ee7b7;
        }

        .footer-text { 
            margin-top: 30px; 
            font-size: 0.9rem; 
            color: #94a3b8; 
        }
    </style>
</head>
<body>

    <div class="portal-card">
        <h1 class="main-title"><i class="fa-solid fa-graduation-cap"></i> ENGLISH PORTAL</h1>
        <p class="sub-title">Sila pilih modul pembelajaran anda</p>

        <div class="btn-group">
            <!-- 1. Modul Get Smart Year 3 (Asal) -->
            <a href="quiz.html" class="btn btn-getsmart">
                <i class="fa-solid fa-rocket"></i> Get Smart Year 3
            </a>

            <!-- 2. Modul Pemulihan (Khas TP1 & TP2) -->
            <a href="remedial.html" class="btn btn-remedial">
                <i class="fa-solid fa-star"></i> Remedial Practice (TP1 & TP2)
            </a>

            <!-- 3. Butang Rekod Guru (Khas Guru Sahaja) -->
            <button onclick="accessTeacherRecord()" class="btn btn-teacher">
                <i class="fa-solid fa-user-lock"></i> Rekod Guru
            </button>
        </div>

        <p class="footer-text">Akses khas cikgu dilindungi kata laluan.</p>
    </div>

    <script>
        // MASUKKAN PAUTAN GOOGLE SHEET CIKGU DI SINI:
        const GOOGLE_SHEET_URL = 'https://docs.google.com/spreadsheets/d/1cBsiuCRK4KBL3_oSi0nka5iL7VA1rQJTJzeMdWL1EDc/edit?gid=0#gid=0'; 
        
        // TETAPKAN KATA LALUAN (PASSWORD) CIKGU DI SINI:
        const TEACHER_PASSWORD = '123'; 

        function accessTeacherRecord() {
            let pass = prompt("Sila masukkan kata laluan Guru untuk mengakses Rekod Guru:");
            
            if (pass === null) {
                // Jika cikgu tekan Cancel, tiada apa berlaku
                return; 
            }
            
            if (pass === TEACHER_PASSWORD) {
                alert("Akses berjaya! Mengalihkan ke Rekod Guru...");
                window.open(GOOGLE_SHEET_URL, '_blank');
            } else {
                alert("Kata laluan salah! Akses ditolak.");
            }
        }
    </script>
</body>
</html>
